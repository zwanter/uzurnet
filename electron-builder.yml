appId: com.uzurnet
productName: UzurNet
directories:
  buildResources: build
# electron-builder adds package.json and production node_modules on its own
files:
  - 'out/**'
  - 'resources/**'
# Chromium UI strings for the app's languages only: en/zh_CN on macOS, en-US/zh-CN elsewhere
electronLanguages:
  - 'en'
  - 'en-US'
  - 'ru'
  - 'zh_CN'
  - 'zh-CN'
extraResources:
  - from: './extra/'
    to: ''
protocols:
  name: 'UzurNet URI Scheme'
  schemes:
    - 'uzurnet'
    - 'clash'
    - 'mihomo'
    - 'koala-clash'
win:
  target:
    - nsis
    - 7z
  artifactName: UzurNet_${arch}-portable.${ext}
  requestedExecutionLevel: requireAdministrator
nsis:
  artifactName: UzurNet_${arch}-setup.${ext}
  uninstallDisplayName: UzurNet
  allowToChangeInstallationDirectory: true
  oneClick: false
  perMachine: true
  createDesktopShortcut: true
  installerIcon: build/installerIcon.ico
  uninstallerIcon: build/installerIcon.ico
  installerHeaderIcon: build/installerIcon.ico
  include: build/nsis/installer.nsh
mac:
  target:
    - pkg
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  artifactName: UzurNet_${arch}.${ext}
pkg:
  allowAnywhere: false
  allowCurrentUserHome: false
linux:
  desktop:
    entry:
      Name: UzurNet
      MimeType: 'x-scheme-handler/uzurnet;x-scheme-handler/clash;x-scheme-handler/mihomo;x-scheme-handler/koala-clash'
  target:
    - deb
    - rpm
    - pacman
  maintainer: zwanter
  category: Utility
  artifactName: UzurNet_${arch}.${ext}
deb:
  afterInstall: 'build/linux/postinst'
rpm:
  afterInstall: 'build/linux/postinst'
pacman:
  afterInstall: 'build/linux/postinst'
  artifactName: UzurNet_${arch}.pkg.tar.xz
npmRebuild: true
publish: []
